<!doctype html><html><head><meta charset="utf-8">
<style>
/* A page torn from the same sketchbook as the website: linen paper, ink, a
   typewriter for the machine and a serif for the name. No remote fonts — the
   popup makes no network requests, so it uses the closest installed faces. */
:root{
  --paper:#f8f6f1; --ink:#2a2724; --body:#5a544b; --note:#6b6250; --meta:#7a7368;
  --line:rgba(42,39,36,.35);
  --serif:"Spectral","Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --mono:"Courier Prime","Courier New",Courier,monospace;
}
*{box-sizing:border-box}
html{color-scheme:light}
body{
  margin:0; width:296px; color:var(--ink);
  background:var(--paper) url("paper.webp") center / 560px auto repeat;   /* a whisper of linen on near-white */
  font:12.5px/1.5 var(--mono);
  -webkit-font-smoothing:antialiased;
}
.hero{text-align:center;padding:20px 18px 14px}
.hero img{width:56px;height:56px;border-radius:14px;display:block;margin:0 auto 8px;
  box-shadow:0 8px 18px -10px rgba(40,30,10,.6)}
.hero h1{margin:0;font:italic 400 24px/1.1 var(--serif);letter-spacing:-.01em}
.hero p{margin:5px 0 0;font-size:11px;color:var(--note);letter-spacing:.02em}

.body{padding:0 16px}
.field{margin-bottom:12px}
label{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--meta);margin-bottom:6px}
select{
  width:100%;appearance:none;-webkit-appearance:none;
  padding:8px 30px 8px 11px;border:1.5px solid var(--ink);border-radius:2px;
  background:transparent;color:var(--ink);font:13px var(--mono);cursor:pointer;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='11' height='7'><path d='M1 1l4.5 4.5L10 1' fill='none' stroke='%232a2724' stroke-width='1.5' stroke-linecap='round'/></svg>");
  background-repeat:no-repeat;background-position:right 11px center;
  transition:background-color .15s;
}
select:hover{background-color:rgba(255,250,236,.7)}
select:focus{outline:none;box-shadow:0 0 0 3px rgba(201,162,39,.28)}
option{color:var(--ink);background:var(--paper)}
optgroup{color:var(--meta);font-style:normal}

/* a stadium button in ink; inverts on hover */
button{
  display:block;width:100%;margin:6px 0 0;padding:12px;cursor:pointer;
  background:transparent;color:var(--ink);border:1.5px solid var(--ink);
  border-radius:999px;
  font:13px var(--mono);letter-spacing:.12em;text-transform:uppercase;
  transition:background .2s,color .2s;
}
button:hover{background:var(--ink);color:var(--paper)}
button:active{transform:translateY(1px)}

#saved{height:0;overflow:hidden;text-align:center;font-size:11px;color:var(--note);
  opacity:0;transition:opacity .18s,height .18s,margin .18s;margin-top:0}
#saved.on{opacity:1;height:15px;margin-top:9px}

.foot{border-top:1px solid var(--line);margin-top:16px;padding:12px 16px 14px;
  color:var(--body);font-size:11px;line-height:1.65}
.keys{display:flex;justify-content:center;gap:14px;margin-bottom:8px;flex-wrap:wrap}
kbd{border:1px solid var(--ink);border-radius:3px;padding:1px 5px;
  font:10.5px var(--mono);color:var(--ink);background:rgba(255,250,236,.6)}
.keys em{font-style:italic;color:var(--meta)}
.remap{text-align:center;margin:-2px 0 8px}
.remap a{color:var(--meta);font-size:10.5px;letter-spacing:.06em;
  text-decoration:underline dotted;text-underline-offset:3px}
.remap a:hover{color:var(--ink)}
.foot .ctx{text-align:center;margin-bottom:8px}
.foot b{color:var(--ink);font-weight:400;mix-blend-mode:multiply;
  background:url("wash.png") center / 100% 100% no-repeat;
  -webkit-box-decoration-break:clone;box-decoration-break:clone;padding:.06em .3em;margin:0 -.3em}
.priv{text-align:center;color:var(--meta);font-size:10.5px;line-height:1.55}
</style></head><body>

<div class="hero">
  <img src="icons/icon128.png" alt="">
  <h1>Chickadee</h1>
  <p>reads pages aloud, entirely on your machine</p>
</div>

<div class="body">
  <div class="field">
    <label for="voice">Voice</label>
    <select id="voice">
      <optgroup label="American English">
        <option value="af_heart">af_heart — A</option>
        <option value="af_bella">af_bella — A−</option>
        <option value="af_nicole">af_nicole — B−</option>
        <option value="af_aoede">af_aoede — C+</option>
        <option value="af_kore">af_kore — C+</option>
        <option value="am_michael">am_michael — C+</option>
        <option value="am_puck">am_puck — C+</option>
        <option value="am_fenrir">am_fenrir — C+</option>
      </optgroup>
      <optgroup label="British English">
        <option value="bf_emma">bf_emma — B−</option>
        <option value="bf_isabella">bf_isabella — C</option>
        <option value="bm_george">bm_george — C</option>
        <option value="bm_fable">bm_fable — C</option>
      </optgroup>
    </select>
  </div>

  <div class="field">
    <label for="speed">Default speed</label>
    <select id="speed">
      <option value="0.9">0.9×</option><option value="1" selected>1×</option>
      <option value="1.25">1.25×</option><option value="1.5">1.5×</option>
      <option value="1.75">1.75×</option><option value="2">2×</option>
    </select>
  </div>

  <button id="read">Read this page</button>
  <div id="saved"></div>
</div>

<div class="foot">
  <!-- Filled from chrome.commands.getAll() so it shows whatever the user has
       actually bound; the defaults below are only the first paint. -->
  <div class="keys" id="keys">
    <span><kbd>⌥</kbd><kbd>R</kbd> read</span>
    <span><kbd>⌥</kbd><kbd>P</kbd> play / pause</span>
  </div>
  <div class="remap"><a id="shortcuts" href="#">Change shortcuts</a></div>
  <div class="ctx">Right-click any word → <b>Read aloud from here</b></div>
  <div class="priv">Nothing leaves your machine.<br>
    Voice model (~310 MB) downloads once, then works offline.</div>
</div>

<script src="popup.js"></script></body></html>
